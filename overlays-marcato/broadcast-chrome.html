<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.Marcato 42 — Broadcast Chrome</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="../overlays/assets/broadcast.css" />
</head>
<body>
  <div class="stage">
    <div
      class="broadcast-root"
      data-broadcast-root
      hidden
      aria-hidden="true"
    >
      <div class="bc-flag-banner" data-bc-flag-banner aria-hidden="true"></div>
      <div class="bc-status" data-bc-status>TELEMETRY…</div>
      <div class="bc-session" data-bc-session></div>
      <aside class="bc-leaderboard" aria-label="Classifica">
        <div class="bc-leaderboard-head">
          <strong>STANDINGS</strong>
          <span>GAP</span>
        </div>
        <ul class="bc-lb-rows" data-bc-lb-rows></ul>
      </aside>
      <aside class="bc-relative" aria-label="Relative">
        <div class="bc-relative-head">RELATIVE</div>
        <div data-bc-rel-rows></div>
      </aside>
      <aside class="bc-focus" data-bc-focus aria-label="Focus"></aside>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="../overlays/broadcast.js"></script>
</body>
</html>
