<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>S.Marcato 42 — Showcase Lobby</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="showcase-mock.css" />
</head>
<body>
  <div class="stage">
    <div class="mock-layer mock-lobby" aria-hidden="true">
      <aside class="mock-lobby-nav">
        <div class="brand">iRACING · UI</div>
        <ul>
          <li>Home</li>
          <li class="active">Garage</li>
          <li>Series</li>
          <li>Replays</li>
          <li>Settings</li>
        </ul>
      </aside>
      <section class="mock-lobby-main">
        <div class="mock-car"><span>S.MARCATO · #42 · MOCK</span></div>
      </section>
      <aside class="mock-lobby-side">
        <h3>Session</h3>
        <div class="row"><span>Status</span><strong>In garage</strong></div>
        <div class="row"><span>Series</span><strong>IMSA</strong></div>
        <div class="row"><span>Track</span><strong>Spa</strong></div>
        <div class="row"><span>Car</span><strong>GT3</strong></div>
      </aside>
    </div>
    <div class="mock-label" style="top: 6%">MOCK LOBBY · WINDOW CAPTURE</div>
    <div class="mock-face" aria-hidden="true"></div>
    <iframe class="chrome-frame" src="live-chrome.html?cam=1" title="Live chrome"></iframe>
  </div>
</body>
</html>
