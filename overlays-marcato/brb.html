<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>S.Marcato 42 — BRB</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div class="stage"><div class="panel">
    <div class="panel-inner">
      <div class="lockup">
        <img
          class="lockup-logo compact"
          src="assets/brand/primary_rosso_corsa_transparent.png"
          alt="S.Marcato 42 Racing"
        />
      </div>
      <h1 class="headline" data-cfg="brbMessage">TORNO SUBITO</h1>
      <p class="subline">Pit stop in corso</p>
      <div class="brb-timer" data-brb-timer hidden>
        <p class="brb-return" data-brb-return>TORNO ALLE --:--</p>
        <div class="countdown brb-countdown" data-brb-countdown hidden>
          <span class="countdown-label" data-brb-countdown-label>RITORNO TRA</span>
          <span class="countdown-value" data-brb-countdown-value>--:--</span>
        </div>
      </div>
      <p class="tagline" data-cfg="tagline">Racing</p>
      <div class="handle" data-cfg="twitchHandle">@senormarcato</div>
    </div>
  </div></div>
  <script src="config.js"></script>
  <script src="../overlays/brb-timer.js"></script>
</body>
</html>
