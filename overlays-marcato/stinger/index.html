<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.Marcato 42 — Stinger</title>
  <link rel="stylesheet" href="../assets/theme.css" />
  <link rel="stylesheet" href="stinger.css" />
</head>
<body>
  <!--
    Preview / export helper for OBS Stinger (~800ms).
    Query: ?preview=1 shows checkerboard + Replay; ?loop=1 repeats.
    See docs/S_MARCATO_42.md.
  -->
  <div class="stage" id="stage" aria-hidden="true">
    <div class="wipe" id="wipe"></div>
    <img
      class="mark"
      src="../assets/brand/mark42_rosso_corsa_transparent.png"
      alt=""
      width="280"
      height="220"
    />
  </div>

  <div class="hud" id="hud">
    <button type="button" id="replay" title="Ricomincia lo sting">Replay</button>
    <span>~800ms · carbon wipe · mark 42 rosso</span>
  </div>

  <script src="stinger.js"></script>
</body>
</html>
