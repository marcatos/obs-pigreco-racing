<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flag FX — S.Marcato</title>
  <link rel="stylesheet" href="assets/flag-fx.css" />
</head>
<body>
  <div class="flag-fx" data-flag-fx data-brand="S.Marcato 42" data-flag="none">
    <div class="flag-fx-sweep" aria-hidden="true"></div>
    <div class="flag-fx-rail top" aria-hidden="true"><div class="flag-fx-rail-inner"></div></div>
    <div class="flag-fx-rail bottom" aria-hidden="true"><div class="flag-fx-rail-inner"></div></div>
    <div class="flag-fx-side left" aria-hidden="true"></div>
    <div class="flag-fx-side right" aria-hidden="true"></div>
    <div class="flag-fx-badge">
      <p class="flag-fx-label" data-flag-fx-label>FLAG</p>
      <p class="flag-fx-sub" data-flag-fx-sub>S.MARCATO 42</p>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="flag-anim.js"></script>
</body>
</html>
