<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>S.Marcato 42 — Starting Soon</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div class="stage"><div class="panel">
    <div class="session-badge" data-session-badge><span data-session-value>RACE</span></div>
    <div class="panel-inner">
      <div class="lockup">
        <img
          class="lockup-wordmark"
          src="assets/brand/wordmark_smarcato_transparent.png"
          alt="S.Marcato"
        />
        <img
          class="lockup-mark"
          src="assets/brand/mark42_rosso_corsa_transparent.png"
          alt="42"
        />
        <img
          class="lockup-tag"
          src="assets/brand/tag_racing_transparent.png"
          alt="Racing"
        />
      </div>
      <h1 class="headline" data-cfg="startingMessage">IN DIRETTA A BREVE</h1>
      <p class="subline" data-cfg="eventTitle">Sim Racing Session</p>
      <div class="countdown" data-countdown>
        <span class="countdown-label" data-countdown-label>SI PARTE TRA</span>
        <span class="countdown-value" data-countdown-value>--:--</span>
      </div>
      <p class="tagline" data-cfg="tagline">Racing</p>
      <div class="handle" data-cfg="twitchHandle">@senormarcato</div>
    </div>
  </div></div>
  <script src="config.js"></script>
  <script src="../overlays/session-badge.js"></script>
  <script src="../overlays/countdown.js"></script>
</body>
</html>
