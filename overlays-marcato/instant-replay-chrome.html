<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>S.Marcato 42 — Instant Replay</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }
    .ir-frame {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      border: 3px solid var(--rosso, #e10600);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }
    .ir-badge {
      position: absolute;
      top: 28px;
      left: 28px;
      padding: 10px 18px;
      font-family: var(--font-display, "Audiowide", sans-serif);
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.12em;
      color: #fff;
      background: rgba(8, 8, 10, 0.82);
      border-left: 4px solid var(--rosso, #e10600);
    }
  </style>
</head>
<body>
  <div class="ir-frame" aria-hidden="true"></div>
  <div class="ir-badge">REPLAY</div>
</body>
</html>
