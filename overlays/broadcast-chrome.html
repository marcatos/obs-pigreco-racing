<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiGreco — Broadcast Chrome</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="assets/broadcast.css" />
  <link rel="stylesheet" href="assets/broadcast-map.css" />
</head>
<body>
  <div class="stage">
    <div
      class="broadcast-root"
      data-broadcast-root
      hidden
      aria-hidden="true"
    >
      <div class="bc-flag-banner" data-bc-flag-banner aria-hidden="true"></div>
      <div class="bc-moment" data-bc-moment hidden aria-live="polite"></div>
      <div class="bc-status" data-bc-status>TELEMETRY…</div>
      <div class="bc-session" data-bc-session></div>
      <aside class="bc-best" data-bc-best hidden aria-hidden="true">
        <div class="bc-best-label">RACE BEST</div>
        <div class="bc-best-body">
          <strong class="bc-best-time" data-bc-best-time>—</strong>
          <span class="bc-best-driver" data-bc-best-driver></span>
        </div>
      </aside>
      <div class="bc-left-rail">
        <aside class="bc-focus bc-panel" data-bc-focus aria-label="Focus"></aside>
        <aside class="bc-relative bc-panel" aria-label="Relative">
          <div class="bc-panel-head">
            <strong>BATTLE</strong>
            <span>GAP</span>
          </div>
          <div class="bc-rel-rows" data-bc-rel-rows></div>
        </aside>
      </div>
      <aside class="bc-leaderboard" aria-label="Classifica">
        <div class="bc-leaderboard-head">
          <strong>STANDINGS</strong>
          <span>GAP</span>
        </div>
        <ul class="bc-lb-rows" data-bc-lb-rows></ul>
      </aside>
      <aside class="bc-fight" data-bc-fight hidden aria-hidden="true">
        <div class="bc-fight-head">
          <strong data-bc-fight-title>BATTLE FOR P—</strong>
          <span>LIVE</span>
        </div>
        <div class="bc-fight-rows" data-bc-fight-rows></div>
      </aside>
      <div class="bc-ticker" data-bc-ticker hidden aria-hidden="true">
        <div class="bc-ticker-label">FIELD</div>
        <div class="bc-ticker-viewport">
          <div class="bc-ticker-track" data-bc-ticker-track></div>
        </div>
      </div>
    </div>
    <div class="track-map-root" data-track-map-root hidden aria-hidden="true">
      <div class="tm-label" data-tm-label>TRACK</div>
      <svg class="tm-svg" viewBox="0 0 100 100" aria-hidden="true">
        <g class="tm-track" data-tm-track></g>
        <g class="tm-sectors" data-tm-sectors></g>
        <g data-tm-cars></g>
      </svg>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="broadcast-director.js"></script>
  <script src="broadcast.js"></script>
  <script src="track-map.js"></script>
</body>
</html>
