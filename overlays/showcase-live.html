<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiGreco — Live Showcase</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    .mock-game {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(5, 5, 5, 0.2), rgba(5, 5, 5, 0.55)),
        url("assets/hero-racing.jpg") center / cover no-repeat;
    }
    .mock-hud {
      position: absolute;
      top: 16%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      color: rgba(247, 250, 252, 0.28);
      text-transform: uppercase;
    }
    .cam-placeholder {
      position: absolute;
      left: 36px;
      bottom: 36px;
      width: 560px;
      height: 315px;
      z-index: 1;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #1a2228, #0c1014);
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="mock-game"></div>
    <div class="mock-hud">MOCK GAMEPLAY · SHOWCASE</div>
    <div class="cam-placeholder">STREAMCAM</div>
    <div class="live-root has-cam no-lower">
      <div class="session-badge" data-session-badge>
        <span data-session-value>RACE</span>
      </div>
      <div class="watermark">
        <img src="assets/logo-pi-official.png" alt="" />
        <div class="watermark-text">
          <strong data-cfg="teamName">PiGreco Racing</strong>
          <span data-cfg="twitchHandle">@senormarcato</span>
        </div>
      </div>
      <div class="cam-frame" aria-hidden="true">
        <span class="cam-corner tl"></span>
        <span class="cam-corner tr"></span>
        <span class="cam-corner bl"></span>
        <span class="cam-corner br"></span>
        <div class="cam-top-bar">
          <span class="cam-nick" data-cfg="username">senormarcato</span>
          <div class="cam-top-cluster">
            <img class="cam-pi" src="assets/logo-pigreco.svg" alt="" />
            <span class="cam-race-num" data-cfg="raceNumber">42</span>
          </div>
        </div>
        <div class="cam-bottom-bar" data-sponsor-rotator="cam-bar" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="session-badge.js"></script>
  <script>
    window.PIGRECO_CONFIG.sponsorInitialDelayMs = 300;
    window.PIGRECO_CONFIG.sponsorDisplayMs = 5000;
    window.PIGRECO_CONFIG.sponsorGapMs = 0;
  </script>
  <script src="sponsors.js"></script>
</body>
</html>
