<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiGreco — Ending</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div class="stage">
    <div class="panel">
      <div class="stripe stripe-top"></div>
      <div class="stripe stripe-bottom"></div>
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="panel-inner ending-inner">
        <img class="logo-mark" src="assets/logo-pi-official.png" alt="PiGreco π" />
        <img class="logo-wordmark" src="assets/logo-wordmark-official.png" alt="PiGreco Racing" />
        <p class="eyebrow" data-cfg="teamName">PiGreco Racing</p>
        <h1 class="headline" data-cfg="endingMessage">GRAZIE PER AVER SEGUITO</h1>
        <p class="subline" data-cfg="endingSub">Ci vediamo alla prossima sessione</p>
        <p class="tagline" data-cfg="pilotName">Simone Marcato</p>
        <div class="handle" data-cfg="twitchHandle">@senormarcato</div>

        <div class="ending-cta" data-ending-cta>
          <img class="ending-qr" data-ending-qr src="assets/qr-discord.png" alt="QR Discord" />
          <div class="ending-cta-copy">
            <p class="ending-cta-text" data-ending-cta-text>Entra nel Discord del team</p>
            <a class="ending-discord-link" data-ending-discord-link href="#" target="_blank" rel="noopener"></a>
            <p class="ending-follow" data-ending-follow></p>
          </div>
        </div>
      </div>
      <div class="partner-row">
        <img src="assets/official/discord.svg" alt="Discord" />
        <img src="assets/official/instagram.svg" alt="Instagram" />
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="ending-cta.js"></script>
</body>
</html>
