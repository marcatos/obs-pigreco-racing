<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiGreco — Live Chrome</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div class="stage">
    <div class="live-root has-cam">
      <div class="sponsor-rotator" data-sponsor-rotator aria-hidden="true"></div>
      <div class="session-badge" data-session-badge>
        <span data-session-value>RACE</span>
      </div>

      <div class="watermark">
        <img src="assets/logo-pi-official.png" alt="" />
        <div class="watermark-text">
          <strong data-cfg="teamName">PiGreco Racing</strong>
          <span data-cfg="twitchHandle">@senormarcato</span>
        </div>
      </div>

      <div class="cam-frame">
        <span class="cam-badge">CAM</span>
      </div>

      <div class="lower-third">
        <div class="lower-body">
          <div class="lower-label" data-cfg="teamName">PiGreco Racing</div>
          <div class="lower-name" data-cfg="pilotName">Simone Marcato</div>
          <div class="lower-meta" data-cfg="eventTitle">Sim Racing Session</div>
        </div>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="session-badge.js"></script>
  <script src="sponsors.js"></script>
</body>
</html>
