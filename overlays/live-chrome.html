<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiGreco — Live Chrome</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div class="stage">
    <div class="live-root has-cam no-lower">
      <div class="session-badge" data-session-badge>
        <span data-session-value>RACE</span>
      </div>

      <div class="watermark">
        <img src="assets/logo-pi-official.png" alt="" />
        <div class="watermark-text">
          <strong data-cfg="teamName">PiGreco Racing</strong>
          <span data-cfg="twitchHandle">@senormarcato</span>
        </div>
      </div>

      <div class="cam-frame" aria-hidden="true">
        <span class="cam-corner tl"></span>
        <span class="cam-corner tr"></span>
        <span class="cam-corner bl"></span>
        <span class="cam-corner br"></span>

        <div class="cam-top-bar">
          <span class="cam-nick" data-cfg="username">senormarcato</span>
          <div class="cam-top-cluster">
            <img class="cam-pi" src="assets/logo-pigreco.svg" alt="" />
            <span class="cam-race-num" data-cfg="raceNumber">42</span>
          </div>
        </div>

        <div class="cam-bottom-bar" data-sponsor-rotator="cam-bar" aria-hidden="true"></div>
      </div>

      <!-- Telemetry stub (hidden unless telemetryEnabled); UI polish in P3-02 -->
      <div class="telemetry-widget" data-telemetry-widget hidden aria-hidden="true"></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="session-badge.js"></script>
  <script src="sponsors.js"></script>
  <script src="telemetry-widget.js"></script>
</body>
</html>
