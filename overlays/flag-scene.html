<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flag Scene</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    .flag-stage {
      width: 1920px; height: 1080px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 28px;
      background: #080a0c;
    }
    .flag-stage[data-flag="yellow"] { background: #1a1600; }
    .flag-stage[data-flag="red"] { background: #1a0608; }
    .flag-stage[data-flag="checkered"] {
      background:
        repeating-conic-gradient(#111 0% 25%, #f2f2f2 0% 50%) 0 0 / 96px 96px;
    }
    .flag-bar {
      width: 70%; height: 28px;
      background: var(--accent, #00c400);
    }
    .flag-stage[data-flag="yellow"] .flag-bar { background: #f5d90a; }
    .flag-stage[data-flag="red"] .flag-bar { background: #e5484d; }
    .flag-stage[data-flag="checkered"] .flag-bar { background: #fff; }
    .flag-label {
      font-size: 96px; font-weight: 800; letter-spacing: 0.18em;
      color: #fff; text-transform: uppercase;
      text-shadow: 0 4px 24px rgba(0,0,0,0.55);
    }
    .flag-sub {
      font-size: 22px; letter-spacing: 0.28em; color: #c5ccd3;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="flag-stage" data-flag-stage>
    <div class="flag-bar" aria-hidden="true"></div>
    <div class="flag-label" data-flag-label>FLAG</div>
    <div class="flag-sub">PiGreco Racing</div>
    <div class="flag-bar" aria-hidden="true"></div>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var flag = (q.get("flag") || "yellow").toLowerCase();
      if (["yellow", "red", "checkered"].indexOf(flag) < 0) flag = "yellow";
      var stage = document.querySelector("[data-flag-stage]");
      var label = document.querySelector("[data-flag-label]");
      if (stage) stage.setAttribute("data-flag", flag);
      if (label) label.textContent = flag === "checkered" ? "CHECKERED" : flag.toUpperCase();
    })();
  </script>
</body>
</html>
